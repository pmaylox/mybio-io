<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<!--CSS-->
<link rel="stylesheet" href="css/style.css">

<title>Contact me</title>
</head>
<body class="contact-page">
<header class="site-header">
    <div class="title-row">
        <div class="title-left">
            <img src="images/envelope.png" alt="envelope icon" class="mini-title">
        </div>
        <h1 id="grad">Under Construction</h1>
        <div class="title-right">
            <img src="images/envelope.png" alt="envelope icon" class="mini-title">

        </div>
    </div>
     <div class="header-grid">
        <nav class="main-nav">
            <ul>
                <li><a href="index.html" class="sprite-link home"><span>Home</span></a></li>
                <li><a href="about.html" class="sprite-link me"><span>About</span></a></li>
            </ul>
        </nav>
    </div>
</header>
<main>
<form action="/submit-form-endpoint" method="POST">
    <div class="form-group">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="firstName" required>
    </div>

    <div class="form-group">
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="lastName" required>
    </div>

    <div class="form-group">
        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" required></textarea>
    </div>

    <button type="submit" class="image-btn">SUBMIT</button>
</form>
</main> 
</body>
<footer id="top-ad">

   </script>

</footer>

</script>
